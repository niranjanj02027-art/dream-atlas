<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff1f6"><title>Ammu OS 💗</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff9fb,#ffedf5,#f8f0ff);font-family:system-ui,-apple-system,sans-serif;color:#63364a}.shell{max-width:900px;margin:auto;padding:20px 15px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:900;color:#7e3857}.sub{color:#9b7182;font-size:.9rem}.orb{font-size:2.5rem}.hero,.panel{background:#ffffffdf;border:1px solid white;border-radius:24px;padding:clamp(20px,5vw,32px);box-shadow:0 12px 35px #9b56701a}.hero{text-align:center}.pill{display:inline-block;background:#ffedf4;color:#a94e75;padding:7px 12px;border-radius:99px;font-size:.78rem;font-weight:800}.hero h1{font-size:clamp(1.7rem,6vw,2.5rem);color:#7e3857}.copy{white-space:pre-line;line-height:1.75}.primary{background:linear-gradient(135deg,#e875a0,#bd73c5);color:white;padding:13px 20px;border-radius:14px;font-weight:800;margin-top:18px;border:0}.hidden{display:none!important}.head{margin:24px 3px 14px}.head h2{margin:0;color:#7e3857}.head p{color:#9b7182}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-height:130px;text-align:left;padding:16px;border-radius:20px;background:#fff;border:1px solid white;box-shadow:0 8px 22px #9b567014;color:#63364a}.tile span{display:block;font-size:1.8rem;margin-bottom:8px}.tile strong{display:block;color:#7e3857;margin-bottom:5px}.tile small{color:#9b7182}.back{background:#ffedf4;color:#7e3857;border:0;border-radius:12px;padding:10px 13px;font-weight:800;margin-bottom:18px}.panel h2{color:#7e3857}.item-list{display:grid;gap:10px;margin-top:18px}.item{width:100%;background:#fff6fa;border:1px solid #f4d6e2;border-radius:16px;padding:15px;text-align:left;color:#7e3857;font-weight:800}.item-body{display:none;white-space:pre-line;line-height:1.75;font-weight:400;color:#63364a;padding:12px 2px 2px}.item.open .item-body{display:block}.placeholder{border:1px dashed #e6a9c4;background:#fff6fa;border-radius:16px;padding:20px;text-align:center;color:#9b7182;margin-top:15px}.count{background:#fff0f6;border-radius:14px;padding:15px;text-align:center;color:#a84c76;font-weight:900;margin-top:15px}.wish{width:100%;display:flex;justify-content:space-between;gap:8px;align-items:center}.foot{text-align:center;color:#9b7182;font-size:.85rem;padding:25px 5px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:350px){.shell{padding:12px 9px}.grid{gap:8px}.tile{padding:12px}}
</style></head><body><main class="shell"><header class="top"><div><div class="brand">AMMU OS 💗</div><div class="sub">Her own little universe</div></div><div class="orb">🌷✨</div></header>
<section id="welcome" class="hero"><span class="pill">A LITTLE WORLD, MADE FOR YOU</span><h1></h1><div class="copy"></div><button id="enter" class="primary"></button></section>
<section id="dashboard" class="hidden"><div class="head"><h2>What would you like to open today? 💕</h2><p>Every little corner has something for you.</p></div><div id="tiles" class="grid"></div><div class="foot">Made with love, just for Ammu Maa ❤️</div></section>
<section id="panel" class="panel hidden"><button id="back" class="back">← Back to my universe</button><h2 id="title"></h2><div id="intro" class="copy"></div><div id="content"></div></section></main>
<script>
const data={"welcome": {"title": "Welcome to Ammu OS 💗", "message": "Ammu Maa❤️🥹\n\nWelcome to your own little universe, Madam Jii! 🫶🏻\n\nEe chikka world specially ninnagagi create madidini maa elli kelavu letters ede nam memories ge ondu place ede ninnagagi chikka chikka wishes ede and enu kelavu surprises wait madtha ede💗\n\nTake your time and explore everything, Ammu maa. This world is yours maa🌷✨", "button": "Enter My Universe✨"}, "sections": [{"title": "Little Letters, Big Feelings 💌", "intro": "Ammu Maa❤️\n\nSometimes manasalli thumbha feelings eruthe, but words alli express madodu easy agalla maa. So ninnagagi kelavu chikka letters ready madidini. Each letter alli nan manasinda banda kelavu words ede Ammu maa🥹🫶🏻", "items": [["❤️ You Are Special", "Ammu Maa, you are special in ways that words can’t fully explain. Nin smile, nin thoughts, nin chikka chikka habits edu yalla ninna unique maduthe maa. Never forget how valuable you are❤️"], ["😊 When You Need a Smile", "Madam Jii, swalpa smile madi maa🥹💗 Nin smile ge bere level charm ede Ammu maa Sometimes one small smile can make an ordinary moment beautiful madam jii So take a little break and smile for yourself today Ammu maa🫶🏻"], ["✨ For Your Future", "Ammu maa, ninna future beautiful ag erli nin dreams fulfill agli Ammu maa and ninge happiness koduva opportunities sigli. Keep believing in yourself maa. You deserve to explore life and become the person you dream of becoming Ammu maa✨"]]}, {"title": "Little Moments, Beautiful Memories 📸", "intro": "Ammu Maa💗\n\nKelavu moments chikkad agi erbodu maa, but ha memories nam heart alli special agi eruthe Ammu maa. Sometimes one photo, one conversation, or one small memory can bring back so many feelings Ammu maa🥹\n\nEe gallery alli nam photos and memories ede Ammu maa. Take your time and explore them, Madam Jii. ❤️", "items": [["💗 A Little Moment", "A little moment, a beautiful memory. 💗"], ["🫶🏻 Forever Memories", "Some moments deserve to be remembered forever. 🫶🏻"], ["🥹 One Picture", "One picture, so many feelings. 🥹❤️"]]}, {"title": "A Little Jar of Wishes for You 🌷", "intro": "Ammu Maa❤️\n\nEe jar alli ninnagagi kelavu chikka wishes hide madidini maa. Ondondu wish open madu and nodu. Each wish is something beautiful I hope life brings to you Ammu maa🥹💗", "items": [["☀️ Happiness", "Ninna life alli reasons to smile tumbi tumbi erbeku Ammu maa. Even on ordinary days, something beautiful should happen that makes your heart happy madam jii☀️"], ["🫂 Peace", "Nin manasige peace sigli maa. Overthinking kammi agli, worries light agli, and ninge peaceful moments tumba sigli Ammu maa🫂"], ["✨ Dreams", "Nin dreams ondu ondagi reality agli Ammu maa. Never stop believing in the beautiful things you want for yourself✨"], ["❤️ Confidence", "Nin mele ninge belief yavaglu erli maa. Never underestimate yourself or forget how much you can achieve❤️"], ["🌍 Beautiful Memories", "Nin life alli beautiful places, beautiful experiences, and unforgettable memories tumba barli maa🌍"], ["💗 Love", "Nin life alli Nin love madoke ,Nin care madoke,nin respect kodake, understand kodake, and nin happiness ge value kodake yavaglu Nan erthini Ammu maa. 💗"]]}, {"title": "Countdown to Your Special Day 🎂", "intro": "Ammu Maa❤️🥹\n\nOctober 23 — nin special day! 🎂💗\n\nEvery day brings us one step closer to your birthday, Madam Jii. I hope this birthday season brings you beautiful smiles, peaceful moments, new hopes, and memories that stay close to your heart.\n\nUntil your special day arrives, there are still little surprises waiting for you, maa. 🫶🏻✨", "items": [["⏳ See Your Birthday Countdown", "Your special day is coming, Ammu Maa! 🎂❤️"]]}, {"title": "A Little Secret for You 🔐", "intro": "Ammu Maa, elli ondu secret message ede maa🥹❤️\n\nReady adaga open madu, Madam Jii. This one comes straight from my heart💌", "items": [["💗 Unlock My Secret", "Ammu Maa❤️\n\nSometimes I wonder if you know how special you are. Nin happiness, nin dreams, nin feelings everything is important maa. Never forget that you deserve kindness, peace, respect, and beautiful things in life🫂💗\n\nEe chikka secret just ninge ondu reminder — you matter, Madam Jii. ❤️"]]}, {"title": "A Song That Reminds Me of You 🎵", "intro": "Ammu Maa💗\n\nKelavu songs just songs agi erala maa. They remind us of people, feelings, and little moments that mean something to us. 🥹\n\nEe song choose madidu nin nenp barutte antha, Madam Jii. When you listen to it, take a small moment for yourself and enjoy it. 🎶❤️", "items": [["🎶 Play Our Little Melody", "Add your chosen song link later."]]}, {"title": "One Last Message for You, Ammu Maa ❤️", "intro": "Ammu Maa❤️🥹\n\nEe chikka Ammu OS create madiddu ninge smile kodbeku antha maa. Each section alli ninnagagi kelavu words, wishes, and feelings hide madidini. 💗\n\nLife yavaglu perfect agi erala, but ninna journey beautiful moments endha tumbirali Ammu maa Nin dreams pursue madu, ninna happiness ge importance kodu, and never forget to be kind to yourself, Madam Jii🫂\n\nNin birthday athra bartha ide, and I hope this countdown gives you little reasons to smile along the way and if possible can we celebrate ur birthday 🎂✨\n\nWith all my love,\n\nForever and Always your Karthik ❤️🫶🏻", "items": []}]};const $=x=>document.getElementById(x);
$("welcome").querySelector("h1").textContent=data.welcome.title;$("welcome").querySelector(".copy").textContent=data.welcome.message;$("enter").textContent=data.welcome.button;
$("enter").onclick=()=>{ $("welcome").classList.add("hidden");$("dashboard").classList.remove("hidden");window.scrollTo(0,0)};
const cards=[["💌","Letters From Karthik","Little letters, big feelings"],["📸","Memory Gallery","Little moments, beautiful memories"],["🫙","A Jar Full of Wishes","Pick a wish made just for you"],["🎂","Birthday Countdown","Counting down to your special day"],["🔐","Secret Vault","A little secret from my heart"],["🎵","Music Corner","A song that reminds me of you"],["❤️","A Message From Karthik","One last message for you"]];
cards.forEach((c,i)=>{const b=document.createElement("button");b.className="tile";b.innerHTML=`<span>${c[0]}</span><strong>${c[1]}</strong><small>${c[2]}</small>`;b.onclick=()=>openCard(i);$("tiles").appendChild(b)});
function makeItems(items,wish=false){const list=document.createElement("div");list.className="item-list";items.forEach(it=>{const b=document.createElement("button");b.className="item";b.innerHTML=it[0]+" <span style='float:right'>＋</span>";const body=document.createElement("div");body.className="item-body";body.textContent=it[1];b.appendChild(body);b.onclick=()=>{b.classList.toggle("open");b.querySelector("span").textContent=b.classList.contains("open")?"−":"＋"};list.appendChild(b)});$("content").appendChild(list)}
function openCard(i){$("dashboard").classList.add("hidden");$("panel").classList.remove("hidden");$("content").innerHTML="";let s=data.sections[i],title=s.title,intro=s.intro;
if(i===1){let p=document.createElement("div");p.className="placeholder";p.innerHTML="<b>Your memories will live here 📸</b><br>Add your photos later to make this gallery yours.";$("content").appendChild(p)}
if(i===3){const now=new Date(),bday=new Date(2026,9,23),days=Math.ceil((bday-now)/86400000);const cd=document.createElement("div");cd.className="count";cd.textContent=days>0?`${days} days until your birthday 🎂💗`:days===0?"It's your birthday, Ammu Maa! 🎂❤️":"Your birthday was on October 23, 2026 ❤️";$("content").appendChild(cd)}
if(i===5){let p=document.createElement("div");p.className="placeholder";p.innerHTML="<b>Add your chosen song 🎵</b><br>We can put a song link here later.";$("content").appendChild(p)}
$("title").textContent=title;$("intro").textContent=intro;if(s.items.length)makeItems(s.items,i===2);window.scrollTo(0,0)}
$("back").onclick=()=>{$("panel").classList.add("hidden");$("dashboard").classList.remove("hidden");window.scrollTo(0,0)};
</script></body></html>
